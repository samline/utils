name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run build
      - run: bun run size
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:e2e
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm --prefix site run check
      - run: npm --prefix site run format:check
      - run: npm --prefix site test
      - run: npm --prefix site run build
      - run: npm --prefix site run check:identity
      - run: npm --prefix site run check:content
